services:
  # ── サーバー (Node.js Web Service) ──────────────────────────
  - type: web
    name: moshimo-box-server
    env: node
    plan: free
    region: singapore
    rootDir: moshimo-box-ai/server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # デプロイ後にAPIキーを手動設定
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: CLIENT_URL
        sync: false        # デプロイ後にクライアントURLを手動設定
      - key: NODE_VERSION
        value: 20

  # ── クライアント (Static Site) ───────────────────────────────
  - type: web
    name: moshimo-box-client
    env: static
    rootDir: moshimo-box-ai/client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false        # デプロイ後にサーバーURLを手動設定
