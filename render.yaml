services:
  # ── サーバー (Node.js Web Service) ──────────────────────────
  - type: web
    name: job-matching-server
    env: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false        # デプロイ後にクライアントURLを手動設定
      - key: NODE_VERSION
        value: 20

  # ── クライアント (Static Site) ───────────────────────────────
  - type: web
    name: job-matching-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false        # デプロイ後にサーバーURLを手動設定
